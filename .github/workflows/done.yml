# DONE: a closed issue leaves the queue. Strip factory:* state; closed as completed → factory:done.
name: done

on:
  issues:
    types: [closed]

permissions:
  contents: read
  issues: write

jobs:
  done:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ github.event.issue.number }}
      REASON: ${{ github.event.issue.state_reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Set terminal state
        run: node factory/lifecycle.ts close "$ISSUE" "$REASON"
