# STATIONS started by an issue label. One workflow, so each label change starts one run;
# jobs whose label does not match are skipped.
name: stations

on:
  issues:
    types: [labeled]

permissions: {}

env:
  APPROVERS: primalivet # keep in sync with the triage-plan job's `if`
  MODEL: z-ai/glm-5.3-flash
  PI_VERSION: 1.4.0
  ISSUE: ${{ github.event.issue.number }}

jobs:
  # TRIAGE + PLAN: approver labels factory:new → agent triages → agent plans
  # → plan comment as swfactory-triage-plan[bot]. A human approves with factory:planned (build job).
  triage-plan:
    permissions:
      contents: read
      issues: read
    concurrency:
      group: triage-plan-${{ github.event.issue.number }}
    # Only approvers start it (spend, untrusted issue text). Other issues wait until an approver re-adds factory:new.
    # `env` is not available in a job `if`.
    if: github.event.label.name == 'factory:new' && contains(fromJSON('["primalivet"]'), github.event.sender.login)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@v31

      # Hidden tests and bench tasks are the oracle; the agent must not read them or name them in a plan.
      - name: Hide bench oracle
        run: rm -rf factory/bench

      - name: Fetch issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: nix develop -c node factory/triage-plan.ts fetch "$ISSUE" > "$RUNNER_TEMP/issue.json"

      - name: Install pi
        run: |
          npm install --prefix "$RUNNER_TEMP/pi" "@earendil-works/pi-coding-agent@$PI_VERSION"
          echo "$RUNNER_TEMP/pi/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Triage
        id: triage
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          nix develop -c node factory/triage-plan.ts triage "$RUNNER_TEMP/issue.json" "$MODEL" runs > "$RUNNER_TEMP/triage.json"
          echo "decision=$(jq -r .decision "$RUNNER_TEMP/triage.json")" >> "$GITHUB_OUTPUT"

      - name: Plan
        if: steps.triage.outputs.decision == 'triaged'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: nix develop -c node factory/triage-plan.ts plan "$RUNNER_TEMP/issue.json" "$MODEL" runs > "$RUNNER_TEMP/plan.md"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runs-triage-plan-issue-${{ github.event.issue.number }}
          path: runs/
          if-no-files-found: ignore

      # The App token exists only after the agents have finished.
      - uses: actions/create-github-app-token@v2
        if: always()
        id: app
        with:
          app-id: ${{ secrets.TRIAGE_PLAN_BOT_APP_ID }}
          private-key: ${{ secrets.TRIAGE_PLAN_BOT_PRIVATE_KEY }}

      - name: Blocked - ask
        if: steps.triage.outputs.decision == 'blocked'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          {
            echo "**Question**"
            echo
            jq -r .question "$RUNNER_TEMP/triage.json"
            echo
            echo "Why: $(jq -r .reason "$RUNNER_TEMP/triage.json")"
            echo
            echo "An approver answers in a comment (only approvers' comments reach the agent), then re-adds \`factory:new\`."
          } > "$RUNNER_TEMP/comment.md"
          gh issue comment "$ISSUE" -R "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
          gh issue edit "$ISSUE" -R "$GITHUB_REPOSITORY" --remove-label factory:new --add-label factory:blocked

      - name: Triaged - post plan
        if: steps.triage.outputs.decision == 'triaged'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          {
            echo "**Plan**"
            echo
            cat "$RUNNER_TEMP/plan.md"
            echo
            echo "---"
            echo "Triaged: $(jq -r .reason "$RUNNER_TEMP/triage.json")"
            echo "Written by the triage-plan station (\`$MODEL\`, pi $PI_VERSION). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Approve: an approver adds \`factory:planned\`. Editing this comment after approval excludes it from the build."
          } > "$RUNNER_TEMP/comment.md"
          gh issue comment "$ISSUE" -R "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
          gh issue edit "$ISSUE" -R "$GITHUB_REPOSITORY" --remove-label factory:new --add-label factory:triaged

      - name: Mark blocked on failure
        if: failure()
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          gh issue edit "$ISSUE" -R "$GITHUB_REPOSITORY" --remove-label factory:new --add-label factory:blocked
          gh issue comment "$ISSUE" -R "$GITHUB_REPOSITORY" --body "Triage-plan station failed. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  # BUILD: approver labels factory:planned → agent implements the plan → PR as swfactory-build[bot].
  build:
    permissions:
      contents: read
      issues: write
    concurrency:
      group: build-${{ github.event.issue.number }}
    env:
      BRANCH: issue-${{ github.event.issue.number }}
    if: github.event.label.name == 'factory:planned'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Only approvers can start a build
        if: ${{ !contains(format(',{0},', env.APPROVERS), format(',{0},', github.event.sender.login)) }}
        run: |
          echo "::error::${{ github.event.sender.login }} is not an approver"
          exit 1

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@v31

      # One factory:* state at a time: drop all (e.g. triaged + planned), then set building.
      - name: Mark building
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          states="$(gh issue view "$ISSUE" -R "$GITHUB_REPOSITORY" --json labels \
            -q '[.labels[].name | select(startswith("factory:"))] | join(",")')"
          gh issue edit "$ISSUE" -R "$GITHUB_REPOSITORY" --remove-label "$states" --add-label factory:building

      - name: Build task from issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: nix develop -c node factory/build-task.ts "$ISSUE" > "$RUNNER_TEMP/task.md"

      - name: Install
        run: |
          nix develop -c pnpm install --frozen-lockfile
          npm install --prefix "$RUNNER_TEMP/pi" "@earendil-works/pi-coding-agent@$PI_VERSION"
          echo "$RUNNER_TEMP/pi/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Preflight
        run: nix develop -c sh -c 'pnpm -s typecheck && pnpm -s check:arch && pnpm -s test:blackbox'

      # Hidden tests and bench tasks are the oracle; the agent must not read them.
      - name: Hide bench oracle
        run: rm -rf factory/bench

      - name: Agent loop
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: nix develop -c node factory/loop.ts "$MODEL" "$(cat "$RUNNER_TEMP/task.md")" 3 | tee "$RUNNER_TEMP/loop.txt"

      - name: Restore bench oracle
        run: git restore factory/bench

      - name: Secret scan
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          git add -A
          if git diff --cached | grep -qF "$OPENROUTER_API_KEY"; then
            echo "::error::diff contains OPENROUTER_API_KEY"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runs-issue-${{ github.event.issue.number }}
          path: runs/
          if-no-files-found: ignore

      # The App token exists only after the agent has finished.
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ secrets.BUILD_BOT_APP_ID }}
          private-key: ${{ secrets.BUILD_BOT_PRIVATE_KEY }}

      - name: Push and open PR as the bot
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BOT: ${{ steps.app.outputs.app-slug }}[bot]
        run: |
          id="$(gh api "users/$BOT" --jq .id)"
          git -c user.name="$BOT" -c user.email="$id+$BOT@users.noreply.github.com" \
            commit -q -m "Implement #$ISSUE" -m "Closes #$ISSUE"
          git push "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" "HEAD:refs/heads/$BRANCH"
          gh pr create -R "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
            --title "$(gh issue view "$ISSUE" -R "$GITHUB_REPOSITORY" --json title -q .title)" \
            --body "Closes #$ISSUE

          Built by the build station (\`$MODEL\`, pi $PI_VERSION). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          \`\`\`
          $(tail -n 5 "$RUNNER_TEMP/loop.txt")
          \`\`\`"

      - name: Mark review
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue edit "$ISSUE" -R "$GITHUB_REPOSITORY" --remove-label factory:building --add-label factory:review

      - name: Mark blocked on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue edit "$ISSUE" -R "$GITHUB_REPOSITORY" --remove-label factory:building --add-label factory:blocked
          gh issue comment "$ISSUE" -R "$GITHUB_REPOSITORY" --body "Build station failed. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
