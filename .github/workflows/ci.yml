# GATES: required status checks on every PR. Names are referenced by branch protection.
# protected-paths runs from main: .github/workflows/gates.yml.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix develop -c pnpm install --frozen-lockfile
      - run: nix develop -c pnpm typecheck
      - run: nix develop -c pnpm check:arch
      - run: nix develop -c pnpm test:blackbox
