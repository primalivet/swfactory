# TRIAGE + PLAN STATION: an approver labels an issue factory:new → agent triages → agent plans
# → plan comment as swfactory-triage-plan[bot]. A human approves the plan with factory:planned (build.yml).
name: triage-plan

on:
  issues:
    types: [labeled]

concurrency:
  group: triage-plan-${{ github.event.issue.number }}

permissions:
  contents: read
  issues: read

env:
  APPROVERS: primalivet # keep in sync with the job's `if`
  MODEL: z-ai/glm-5.3-flash
  PI_VERSION: 1.4.0
  ISSUE: ${{ github.event.issue.number }}

jobs:
  triage-plan:
    # Only approvers start it (spend, untrusted issue text). Other issues wait until an approver re-adds factory:new.
    # `env` is not available in a job `if`.
    if: github.event.label.name == 'factory:new' && contains(fromJSON('["primalivet"]'), github.event.sender.login)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@v31

      # Hidden tests and bench tasks are the oracle; the agent must not read them or name them in a plan.
      - name: Hide bench oracle
        run: rm -rf factory/bench

      - name: Fetch issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: nix develop -c node factory/triage-plan.ts fetch "$ISSUE" > "$RUNNER_TEMP/issue.json"

      - name: Install pi
        run: |
          npm install --prefix "$RUNNER_TEMP/pi" "@earendil-works/pi-coding-agent@$PI_VERSION"
          echo "$RUNNER_TEMP/pi/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Triage
        id: triage
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          nix develop -c node factory/triage-plan.ts triage "$RUNNER_TEMP/issue.json" "$MODEL" runs > "$RUNNER_TEMP/triage.json"
          echo "decision=$(jq -r .decision "$RUNNER_TEMP/triage.json")" >> "$GITHUB_OUTPUT"

      - name: Plan
        if: steps.triage.outputs.decision == 'triaged'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: nix develop -c node factory/triage-plan.ts plan "$RUNNER_TEMP/issue.json" "$MODEL" runs > "$RUNNER_TEMP/plan.md"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runs-triage-plan-issue-${{ github.event.issue.number }}
          path: runs/
          if-no-files-found: ignore

      # The App token exists only after the agents have finished.
      - uses: actions/create-github-app-token@v2
        if: always()
        id: app
        with:
          app-id: ${{ secrets.TRIAGE_PLAN_BOT_APP_ID }}
          private-key: ${{ secrets.TRIAGE_PLAN_BOT_PRIVATE_KEY }}

      - name: Blocked - ask
        if: steps.triage.outputs.decision == 'blocked'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          {
            echo "**Question**"
            echo
            jq -r .question "$RUNNER_TEMP/triage.json"
            echo
            echo "Why: $(jq -r .reason "$RUNNER_TEMP/triage.json")"
            echo
            echo "An approver answers in a comment (only approvers' comments reach the agent), then re-adds \`factory:new\`."
          } > "$RUNNER_TEMP/comment.md"
          gh issue comment "$ISSUE" -R "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
          gh issue edit "$ISSUE" -R "$GITHUB_REPOSITORY" --remove-label factory:new --add-label factory:blocked

      - name: Triaged - post plan
        if: steps.triage.outputs.decision == 'triaged'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          {
            echo "**Plan**"
            echo
            cat "$RUNNER_TEMP/plan.md"
            echo
            echo "---"
            echo "Triaged: $(jq -r .reason "$RUNNER_TEMP/triage.json")"
            echo "Written by the triage-plan station (\`$MODEL\`, pi $PI_VERSION). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Approve: an approver adds \`factory:planned\`. Editing this comment after approval excludes it from the build."
          } > "$RUNNER_TEMP/comment.md"
          gh issue comment "$ISSUE" -R "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
          gh issue edit "$ISSUE" -R "$GITHUB_REPOSITORY" --remove-label factory:new --add-label factory:triaged

      - name: Mark blocked on failure
        if: failure()
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          gh issue edit "$ISSUE" -R "$GITHUB_REPOSITORY" --remove-label factory:new --add-label factory:blocked
          gh issue comment "$ISSUE" -R "$GITHUB_REPOSITORY" --body "Triage-plan station failed. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
